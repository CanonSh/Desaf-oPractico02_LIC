<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <title>Problema 02</title>
  </head>
  <body class="bg-light">
    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <h1 class="text-center mb-4 text-primary fw-bold">
            Gasolinera Don Bosco
          </h1>

          <!-- Formulario  -->
          <div class="card shadow-sm p-4 mb-4">
            <form id="formGasolinera">
              <div class="mb-3">
                <label for="nombre" class="form-label"
                  >Ingrese su nombre:</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="nombre"
                  name="nombre"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="correo" class="form-label"
                  >Ingrese su correo:</label
                >
                <input
                  type="email"
                  class="form-control"
                  id="correo"
                  name="correo"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="marca" class="form-label"
                  >Ingrese la marca del vehiculo:</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="marca"
                  name="marca"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="tipoVehiculo" class="form-label"
                  >Tipo de vehiculo:</label
                >
                <select
                  id="tipoVehiculo"
                  class="form-select"
                  name="tipoVehiculo"
                >
                  <option value="sedan">Sedan</option>
                  <option value="camioneta">Camioneta</option>
                  <option value="camion">Camion</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="tipoCombustible" class="form-label"
                  >Tipo de combustible:</label
                >
                <select
                  id="tipoCombustible"
                  class="form-select"
                  name="tipoCombustible"
                >
                  <option value="especial">Especial ($3.78)</option>
                  <option value="regular">Regular ($3.64)</option>
                  <option value="diesel">Diesel ($3.43)</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="galones" class="form-label"
                  >Cantidad de galones:</label
                >
                <input
                  type="number"
                  class="form-control"
                  id="galones"
                  name="galones"
                  step="0.01"
                  min="0.1"
                  required
                />
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2">
                Registrar Venta
              </button>
            </form>
          </div>

          <!-- Contenedor de los resultados -->
          <div id="resultado" class="card shadow-sm p-4 bg-white">
            <h3 class="h5 text-secondary border-bottom pb-2 mb-3">
              Estadísticas y Última Venta
            </h3>
            <p id="statsClientes" class="fw-bold text-dark">
              Total de clientes atendidos: 0
            </p>
            <p id="fechaSistema" class="text-muted small">
              Fecha del sistema: -
            </p>
            <div id="detalleFactura" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/Problema02.js"></script>
  </body>
</html>
