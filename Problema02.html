<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Problema02.css" />
    <title>Gasolinera Don Bosco - Problema 02</title>
  </head>
  <body>
    <h1>Gasolinera Don Bosco - Facturacion</h1>

    <form id="formGasolinera">
      <label for="nombre">Ingrese su nombre:</label>
      <input type="text" id="nombre" name="nombre" required />

      <label for="correo">Ingrese su correo:</label>
      <input type="email" id="correo" name="correo" required />

      <label for="marca">Ingrese la marca del vehículo:</label>
      <input type="text" id="marca" name="marca" required />

      <label for="tipoVehiculo">Tipo de vehiculo:</label>
      <select id="tipoVehiculo" name="tipoVehiculo">
        <option value="sedan">Sedan</option>
        <option value="camioneta">Camioneta</option>
        <option value="camion">Camion</option>
      </select>

      <label for="tipoCombustible">Tipo de combustible:</label>
      <select id="tipoCombustible" name="tipoCombustible">
        <option value="especial">Especial ($3.78)</option>
        <option value="regular">Regular ($3.64)</option>
        <option value="diesel">Diesel ($3.43)</option>
      </select>

      <label for="galones">Cantidad de galones:</label>
      <input
        type="number"
        id="galones"
        name="galones"
        step="0.01"
        min="0.1"
        required
      />

      <input type="submit" value="Registrar Venta" />
    </form>

    <div id="resultado">
      <h3>Estadisticas y Ultima Venta</h3>
      <p id="statsClientes">Total de clientes atendidos: 0</p>
      <p id="fechaSistema">Fecha del sistema: -</p>
      <div id="detalleFactura"></div>
    </div>

    <script src="Problema02.js"></script>
  </body>
</html>
